# Task 0.9 do plano de ação: build do back + lint do front em cada PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build
        working-directory: backend
        run: ./mvnw -B clean package

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      # Existem 10 erros de lint pré-existentes (react-hooks/set-state-in-effect
      # em useUserData.js e nos componentes, + 'process' no vite.config.js).
      # Reporta sem bloquear o merge; quando forem corrigidos, remova o
      # continue-on-error para o lint virar obrigatório.
      - name: Lint
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
