# /etc/nginx/sites-available/econexo
# Substitua seudominio.com pelo seu domínio real (ex.: econexo.com.br)
# Depois: sudo ln -s /etc/nginx/sites-available/econexo /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com www.seudominio.com;

    # Redireciona HTTP -> HTTPS (descomente após configurar Let's Encrypt)
    # return 301 https://$host$request_uri;

    root /var/www/econexo/frontend;
    index index.html;

    # gzip pra reduzir transferência
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Assets do Vite com hash no nome -> cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API REST -> Spring Boot localhost:8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # SPA: tudo que não casar com arquivo cai no index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Após configurar Let's Encrypt (sudo certbot --nginx -d seudominio.com -d www.seudominio.com)
# o certbot adiciona automaticamente um server block 443 com SSL.
