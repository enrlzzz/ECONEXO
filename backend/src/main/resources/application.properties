# Configurações base (compartilhadas entre dev e prod)
# Para alternar entre profiles use: --spring.profiles.active=prod
# ou variável de ambiente: SPRING_PROFILES_ACTIVE=prod

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Render/Railway/Fly injetam a porta na variável PORT; VPS/systemd usa SERVER_PORT.
# A ordem abaixo cobre os dois sem precisar de config extra em nenhum deles.
server.port=${PORT:${SERVER_PORT:8080}}

# --- Autenticação ---
# Chave de assinatura do JWT. NUNCA commitar o valor de produção: em prod vem
# da variável de ambiente JWT_SECRET (ver application-prod.properties).
econexo.jwt.validade-horas=${JWT_VALIDADE_HORAS:8}

# --- Rate limit de login e cadastro ---
# 10 tentativas, bloqueio de 15 minutos (contado por e-mail).
econexo.rate-limit.max-tentativas=${RATE_LIMIT_TENTATIVAS:10}
econexo.rate-limit.bloqueio-minutos=${RATE_LIMIT_BLOQUEIO_MIN:15}

# Limite por IP = max-tentativas x este multiplicador (padrão 3 = 30 por IP).
# Existe por causa de rede com NAT, onde muita gente legítima divide o mesmo IP.
# Para tratar o IP com o mesmo rigor do e-mail, defina 1.
econexo.rate-limit.multiplicador-ip=${RATE_LIMIT_MULTIPLICADOR_IP:3}

# Não expor a versão do servidor no header de resposta.
server.error.include-stacktrace=never
server.error.include-message=never
