# Perfil de produção (VPS Hostinger)
# TODAS as credenciais vêm de variáveis de ambiente — nada hard-coded.
# Setar no systemd ou /etc/environment:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS
#   APP_ALLOWED_ORIGINS (ex: https://seudominio.com,https://www.seudominio.com)

# TLS obrigatório na conexão com o banco.
#
# O backend roda no Render (Oregon) e o MySQL fica na Hostinger: o tráfego
# atravessa a internet pública. Com useSSL=false — como estava — a senha do
# banco e TODO o conteúdo trafegado (incluindo CPF) passavam legíveis por
# cada roteador do caminho.
#
# sslMode=REQUIRED criptografa sem exigir validação da cadeia do certificado.
# VERIFY_CA seria mais forte, mas hospedagem compartilhada costuma usar
# certificado autoassinado e a conexão simplesmente não abriria.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:Econexo}?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Em prod NÃO deixa o Hibernate mexer no schema — use migrations ou aplique schema.sql manualmente.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jackson.serialization.indent_output=false

# --- Pool de conexões (HikariCP) ---
# O MySQL fica na Hostinger e o backend no Render: cada conexão nova custa
# TCP + TLS + autenticação através da internet (>1s). Por isso:
#  - poucas conexões (a hospedagem compartilhada limita as por usuário e o
#    free tier tem 512 MB);
#  - keepalive-time: a cada 2 min o Hikari valida as conexões ociosas, para
#    elas não serem derrubadas pelo servidor e o próximo login pagar a
#    reconexão;
#  - max-lifetime menor que o wait_timeout do servidor (desconhecido na
#    Hostinger). Se o log mostrar "Connection ... marked as broken", baixe.
# Tudo pode ser ajustado por variável de ambiente sem novo deploy de código.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:120000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}

# Logs reduzidos
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN

# CORS restrito aos domínios autorizados.
# Sem valor, o backend se recusa a subir (ver WebConfig) — em produção,
# falhar no deploy é melhor do que abrir a API para qualquer origem.
econexo.cors.allowed-origins=${APP_ALLOWED_ORIGINS}

# Chave de assinatura do JWT — obrigatória, sem default.
# Gere com: openssl rand -base64 48
# Se vazar, todo token vira forjável: rotacione e todos os logins caem.
econexo.jwt.secret=${JWT_SECRET}

# Chave de criptografia do CPF em repouso (AES-256-GCM) — obrigatória.
# Gere com: openssl rand -base64 32
#
# ATENÇÃO: se esta chave for trocada, os CPFs já gravados tornam-se
# ILEGÍVEIS — não há como recuperá-los. Trocar exige redecifrar a base com a
# chave antiga antes.
econexo.crypto.key=${ECONEXO_CRYPTO_KEY}
