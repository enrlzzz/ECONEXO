# Perfil de desenvolvimento local
spring.datasource.url=jdbc:mysql://localhost:3306/Econexo?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.indent_output=true

# CORS aberto em dev (qualquer origem) - configurado via WebConfig
econexo.cors.allowed-origins=http://localhost:5173,http://localhost:4173
