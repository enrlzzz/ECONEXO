# Perfil de desenvolvimento local
spring.datasource.url=jdbc:mysql://localhost:3308/Econexo?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.indent_output=true

# CORS aberto em dev (qualquer origem) - configurado via WebConfig
econexo.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# Chave JWT só para desenvolvimento local. É pública de propósito — está num
# repositório aberto. Em produção a chave vem de JWT_SECRET e NUNCA daqui.
econexo.jwt.secret=dev-apenas-nao-use-em-producao-chave-local-econexo-2026

# Chave de criptografia do CPF em repouso — só para desenvolvimento local.
# Pública de propósito (repositório aberto). Em produção vem de
# ECONEXO_CRYPTO_KEY e NUNCA daqui: se a chave viver junto do banco, quem
# rouba o banco rouba a chave e a criptografia não serve para nada.
econexo.crypto.key=dev-apenas-chave-local-de-criptografia-econexo-32b
