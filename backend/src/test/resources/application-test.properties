# Perfil de teste: H2 em memória, para os testes de segurança rodarem em
# qualquer máquina e no CI sem precisar de um MySQL instalado.

spring.datasource.url=jdbc:h2:mem:econexo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

econexo.cors.allowed-origins=http://localhost:5173
econexo.jwt.secret=chave-de-teste-com-mais-de-32-caracteres-para-hs256-ok
